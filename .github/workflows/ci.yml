name: CI

# Run checks that match the files changed in a PR. PRs get the fast Node gate
# (lint, types, tests); Vercel's preview build covers the production build.
# The browser suite runs on PRs only when data/auth code or the schema changed,
# and always after merge to main. Dependency audit runs nightly in audit.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      database: ${{ steps.scope.outputs.database }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            echo 'quality=true' >> "$GITHUB_OUTPUT"
            echo 'database=false' >> "$GITHUB_OUTPUT"
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-files"
          quality=false
          database=false
          e2e=false
          while IFS= read -r -d '' file; do
            case "$file" in
              docs/*|README.md|HANDOFF.md|AGENTS.md|CLAUDE.md|.beads/*) ;;
              *) quality=true ;;
            esac
            case "$file" in
              supabase/*|.github/workflows/ci.yml)
                database=true ;;
            esac
            case "$file" in
              src/lib/*|src/app/api/*|src/proxy.*|e2e/*|supabase/*|package-lock.json|playwright.config.*|next.config.*|vercel.json|.github/workflows/ci.yml)
                e2e=true ;;
            esac
          done < "$RUNNER_TEMP/ci-changed-files"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  # Node quality gates: ESLint, TypeScript, and tests (unit + jsdom UI).
  # No production secrets are used.
  quality:
    needs: changes
    # If classification fails, keep the required quality check red rather than
    # letting a skipped dependent job appear successful.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.quality == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Tests run with NO Supabase env: the unit/UI suites exercise the
      # no-client fallback path and inject fakes elsewhere. Real values here
      # would make SignInPanel construct a live client and break that test.
      - name: Tests (unit)
        run: npm run test:unit

      - name: Tests (jsdom UI)
        run: npm run test:ui

  # Supabase pgTAP migrations and database tests. GitHub-hosted ubuntu runners
  # ship Docker, which the local Supabase stack requires. The CLI version is
  # pinned so migration/test behaviour matches local development.
  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Start local Supabase stack (applies migrations)
        run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable credentials for the local Supabase stack; never used for
      # deployed environments or production data.
      DESTINATION_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DESTINATION_OAUTH_STATE_SECRET: e2e-disposable-oauth-state-secret
      NOTION_OAUTH_CLIENT_ID: e2e-client-id
      NOTION_OAUTH_CLIENT_SECRET: e2e-client-secret
      NOTION_OAUTH_REDIRECT_URI: http://localhost:3100/api/archive/destinations/notion/oauth/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # A disposable Supabase stack for the authenticated journeys. Migrations
      # are applied on start; no production data or secrets are involved.
      - name: Start local Supabase stack (applies migrations)
        run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api,edge-runtime,logflare,vector,supavisor

      - name: Wire the dev server to the disposable stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Browser journeys (public + authenticated)
        run: npm run test:e2e

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
